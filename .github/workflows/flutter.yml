name: Flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publishes: ${{ steps.gate.outputs.publishes }}
    steps:
      - name: Decide whether this run publishes a release
        id: gate
        # Both jobs read this one answer, so the release gate and the "build the
        # APK here instead" gate cannot drift apart into a run that builds twice
        # or not at all. A manual dispatch of `main` counts as a publish: without
        # it a release that never ran — a cancelled run, an unassigned runner —
        # could only be recovered by pushing another commit.
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ] && {
            [ "$GITHUB_EVENT_NAME" = 'push' ] ||
            [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]
          }; then
            printf 'publishes=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'publishes=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Format sources and expose any required diff
        run: |
          dart format lib test
          git diff -- lib test pubspec.lock
      - run: flutter analyze
      - run: flutter test
      - name: Require committed formatting and dependency lock
        run: git diff --exit-code -- lib test pubspec.lock
      - name: Require private Android signing
        if: steps.gate.outputs.publishes != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required release-signing secrets: %s\n' "${missing[*]}" >&2
            printf 'Run tool/configure_android_signing.sh before merging.\n' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
      - name: Build release APK
        if: steps.gate.outputs.publishes != 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release
      - name: Upload release APK
        if: steps.gate.outputs.publishes != 'true'
        uses: actions/upload-artifact@v4
        # Building is a required gate. Artifact retention is best-effort because
        # repository-level Actions storage quotas are outside this workflow.
        continue-on-error: true
        with:
          name: superhealth-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  release:
    name: Publish signed APK
    needs: verify
    if: needs.verify.outputs.publishes == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - name: Require private Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required release-signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release
      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          if [ -z "$version" ]; then
            printf 'Could not read the app version from pubspec.yaml.\n' >&2
            exit 1
          fi
          tag="v$version"
          asset="superhealth-${version/+/-}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$asset"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release for this version already exists. Re-running the same
            # commit may refresh its asset, but a *new* commit under the same
            # version would silently replace the APK inside a release that is
            # dated, titled, and targeted at the older build — and ship it with
            # an unchanged versionCode, which Android refuses to install as an
            # update. Fail loudly instead.
            existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish -q .targetCommitish)"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              printf 'Release %s already exists and points at %s.\n' \
                "$tag" "$existing" >&2
              printf 'Bump "version:" in pubspec.yaml before merging: a new build needs a new versionCode, or it cannot be installed over the previous one.\n' >&2
              exit 1
            fi
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SuperHealth $version" \
              --notes "Private signed Android build for SuperHealth $version."
          fi
